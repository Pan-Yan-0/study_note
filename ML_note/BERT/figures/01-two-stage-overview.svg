<svg xmlns="http://www.w3.org/2000/svg" width="680" height="416" viewBox="0 0 680 416" role="img">
<title>BERT 两阶段总览：主体共用，头按任务更换</title>
<desc>从上到下：阶段 A 预训练和阶段 B 微调各有自己的输入，都进入同一个 BERT 主体（输入嵌入、12 层编码器、每个词一个向量），再分别接 MLM 头与 NSP 头，或新加的分类头。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#B4B2A9}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect x="0" y="0" width="680" height="416" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="box" x="40" y="30" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="48" text-anchor="middle" dominant-baseline="central">阶段 A：预训练</text>
<text class="ts" x="180" y="66" text-anchor="middle" dominant-baseline="central">无标注文本，部分词被遮住</text>
<rect class="box" x="360" y="30" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="48" text-anchor="middle" dominant-baseline="central">阶段 B：微调</text>
<text class="ts" x="500" y="66" text-anchor="middle" dominant-baseline="central">有标注影评，如 IMDB</text>
<line x1="180" y1="92" x2="180" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="92" x2="500" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="40" y="140" width="600" height="120" rx="16" stroke-width="0.5"/>
<text class="th" x="60" y="162" text-anchor="start" dominant-baseline="central">BERT 主体：A 阶段训练出权重，B 阶段以此为起点</text>
</g>
<rect class="box" x="60" y="180" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="198" text-anchor="middle" dominant-baseline="central">输入嵌入</text>
<text class="ts" x="140" y="216" text-anchor="middle" dominant-baseline="central">三种向量相加</text>
<line x1="224" y1="208" x2="254" y2="208" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="260" y="180" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central">12 层编码器</text>
<text class="ts" x="340" y="216" text-anchor="middle" dominant-baseline="central">自注意力 + FFN</text>
<line x1="424" y1="208" x2="454" y2="208" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="460" y="180" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="198" text-anchor="middle" dominant-baseline="central">输出向量</text>
<text class="ts" x="540" y="216" text-anchor="middle" dominant-baseline="central">每个词 768 维</text>
<line x1="105" y1="266" x2="105" y2="298" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="266" x2="255" y2="298" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="266" x2="500" y2="298" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="40" y="310" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="328" text-anchor="middle" dominant-baseline="central">MLM 头</text>
<text class="ts" x="105" y="346" text-anchor="middle" dominant-baseline="central">猜被遮住的词</text>
</g>
<g class="c-teal">
<rect x="190" y="310" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="328" text-anchor="middle" dominant-baseline="central">NSP 头</text>
<text class="ts" x="255" y="346" text-anchor="middle" dominant-baseline="central">是否上下句</text>
</g>
<g class="c-teal">
<rect x="360" y="310" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="328" text-anchor="middle" dominant-baseline="central">分类头</text>
<text class="ts" x="500" y="346" text-anchor="middle" dominant-baseline="central">新加的层：正面 / 负面</text>
</g>
<rect class="c-purple" x="40" y="381" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="388" dominant-baseline="central">两阶段共用的主体</text>
<rect class="c-teal" x="200" y="381" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="222" y="388" dominant-baseline="central">按任务更换的头</text>
</svg>
