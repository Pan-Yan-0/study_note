<svg xmlns="http://www.w3.org/2000/svg" width="608" height="554" viewBox="0 0 380 346" role="img">
<title>一轮会议：先跨列交流，再各列自己消化</title>
<desc>六个词各是一列四个神经元。第一步自注意力：每一列都和所有列相连，love 这一列的六条连线按权重粗细不同；第二步前馈层：每列只经过自己的小方块，列与列之间没有连线。这样的一轮重复十二次。</desc>
