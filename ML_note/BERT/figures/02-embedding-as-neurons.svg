<svg xmlns="http://www.w3.org/2000/svg" width="608" height="592" viewBox="0 0 380 370" role="img">
<title>嵌入层展开成神经元：三组 one-hot 输入连到 4 个输出神经元</title>
<desc>左侧是词表、位置、句子三组输入神经元，每组只有一个神经元为 1：love、位置 2、句子 A。它们各自连向右侧 4 个输出神经元，输出值是三条连线权重之和，分别为 0.9、0.2、0.0、0.4。</desc>
