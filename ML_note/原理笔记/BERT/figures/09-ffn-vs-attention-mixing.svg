<svg xmlns="http://www.w3.org/2000/svg" width="608" height="627" viewBox="0 0 380 392" role="img">
<title>前馈层只在一行内部混合，注意力在行与行之间混合</title>
<desc>上图：X 是 6 行 4 列，乘 4 行 16 列的 W1，结果第 3 行 love 只用到 X 的第 3 行。下图：A 是 6 行 6 列的注意力权重，乘 6 行 2 列的 V，结果第 3 行 love 用到了 V 的全部 6 行。</desc>
<style>
