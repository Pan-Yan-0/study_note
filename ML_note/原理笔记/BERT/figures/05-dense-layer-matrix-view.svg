<svg xmlns="http://www.w3.org/2000/svg" width="608" height="480" viewBox="0 0 380 300" role="img">
<title>全连接层的矩阵写法：x 的每一行和权重相乘，整列相加</title>
<desc>左边一列是 love 的 x 四个数，右边两列分别是神经元 q1 和 q2 的四个权重，同一行的数相乘，整列加起来，得到 q1 等于 −0.897，q2 留作练习。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#B4B2A9}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect x="0" y="0" width="380" height="300" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="98" y="28" text-anchor="middle" dominant-baseline="central">x（love）</text>
<text class="th" x="211" y="28" text-anchor="middle" dominant-baseline="central">q₁ 的权重</text>
<text class="th" x="305" y="28" text-anchor="middle" dominant-baseline="central">q₂ 的权重</text>
<rect class="box" x="60" y="50" width="76" height="30" rx="4" stroke-width="0.5"/>
<text class="t" x="98" y="65" text-anchor="middle" dominant-baseline="central">1.570</text>
<text class="ts" x="156" y="65" text-anchor="middle" dominant-baseline="central">×</text>
<g class="c-purple"><rect x="176" y="50" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="211" y="65" text-anchor="middle" dominant-baseline="central">−1</text>
</g>
<rect class="box" x="270" y="50" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="305" y="65" text-anchor="middle" dominant-baseline="central">−1</text>
<rect class="box" x="60" y="86" width="76" height="30" rx="4" stroke-width="0.5"/>
<text class="t" x="98" y="101" text-anchor="middle" dominant-baseline="central">−0.523</text>
<text class="ts" x="156" y="101" text-anchor="middle" dominant-baseline="central">×</text>
<g class="c-purple"><rect x="176" y="86" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="211" y="101" text-anchor="middle" dominant-baseline="central">+1</text>
</g>
<rect class="box" x="270" y="86" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="305" y="101" text-anchor="middle" dominant-baseline="central">−1</text>
<rect class="box" x="60" y="122" width="76" height="30" rx="4" stroke-width="0.5"/>
<text class="t" x="98" y="137" text-anchor="middle" dominant-baseline="central">−1.121</text>
<text class="ts" x="156" y="137" text-anchor="middle" dominant-baseline="central">×</text>
<g class="c-purple"><rect x="176" y="122" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="211" y="137" text-anchor="middle" dominant-baseline="central">−1</text>
</g>
<rect class="box" x="270" y="122" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="305" y="137" text-anchor="middle" dominant-baseline="central">−1</text>
<rect class="box" x="60" y="158" width="76" height="30" rx="4" stroke-width="0.5"/>
<text class="t" x="98" y="173" text-anchor="middle" dominant-baseline="central">0.075</text>
<text class="ts" x="156" y="173" text-anchor="middle" dominant-baseline="central">×</text>
<g class="c-purple"><rect x="176" y="158" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="211" y="173" text-anchor="middle" dominant-baseline="central">+1</text>
</g>
<rect class="box" x="270" y="158" width="70" height="30" rx="4" stroke-width="0.5"/>
<text class="th" x="305" y="173" text-anchor="middle" dominant-baseline="central">+1</text>
<line x1="211" y1="194" x2="211" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="305" y1="194" x2="305" y2="236" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="200" dominant-baseline="central">同一行相乘，</text>
<text class="ts" x="40" y="218" dominant-baseline="central">整列加起来</text>
<text class="th" x="40" y="259" dominant-baseline="central">输出</text>
<g class="c-purple"><rect x="176" y="242" width="70" height="34" rx="6" stroke-width="0.5"/>
<text class="th" x="211" y="259" text-anchor="middle" dominant-baseline="central">−0.897</text>
</g>
<rect class="box" x="270" y="242" width="70" height="34" rx="6" stroke-width="0.5"/>
<text class="th" x="305" y="259" text-anchor="middle" dominant-baseline="central">?</text>
</svg>
