<svg xmlns="http://www.w3.org/2000/svg" width="608" height="1008" viewBox="0 0 380 630" role="img">
<title>一句话在 BERT 里从输入到 loss 再到反向传播的完整数据流</title>
<desc>原句经过切词得到 6 个 token，嵌入层得到 6×768，经过 12 层编码器仍是 6×768。预训练时取被遮的那一列做 MLM，微调时取 CLS 那一列经 pooler 做二分类，各自和答案比较算 loss，再反向传播更新全部权重。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#B4B2A9}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect x="0" y="0" width="380" height="630" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="40" y="16" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="34" text-anchor="middle" dominant-baseline="central">原句</text>
<text class="ts" x="190" y="52" text-anchor="middle" dominant-baseline="central">I love this movie</text>
<rect class="box" x="40" y="88" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="106" text-anchor="middle" dominant-baseline="central">切词，首尾加 [CLS]、[SEP]</text>
<text class="ts" x="190" y="124" text-anchor="middle" dominant-baseline="central">6 个 token；预训练时 love 换成 [MASK]</text>
<g class="c-purple"><rect x="40" y="160" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="178" text-anchor="middle" dominant-baseline="central">嵌入层：三张表相加 + LayerNorm</text>
<text class="ts" x="190" y="196" text-anchor="middle" dominant-baseline="central">得到 6 × 768</text>
</g>
<g class="c-purple"><rect x="40" y="232" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="250" text-anchor="middle" dominant-baseline="central">编码器 × 12 层</text>
<text class="ts" x="190" y="268" text-anchor="middle" dominant-baseline="central">自注意力 + 前馈，仍是 6 × 768</text>
</g>
<rect class="box" x="40" y="304" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="322" text-anchor="middle" dominant-baseline="central">最后一层的输出</text>
<text class="ts" x="190" y="340" text-anchor="middle" dominant-baseline="central">6 列，每列 768 个数</text>
<line x1="190" y1="72" x2="190" y2="82" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="144" x2="190" y2="154" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="216" x2="190" y2="226" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="288" x2="190" y2="298" class="arr" marker-end="url(#arrow)"/>
<line x1="110" y1="360" x2="110" y2="386" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="360" x2="270" y2="386" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="392" width="140" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="410" text-anchor="middle" dominant-baseline="central">预训练：MLM</text>
<text class="ts" x="110" y="428" text-anchor="middle" dominant-baseline="central">取被遮的那一列</text>
<text class="ts" x="110" y="446" text-anchor="middle" dominant-baseline="central">768 → 30,522</text>
</g>
<g class="c-teal"><rect x="200" y="392" width="140" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="270" y="410" text-anchor="middle" dominant-baseline="central">微调：情感分类</text>
<text class="ts" x="270" y="428" text-anchor="middle" dominant-baseline="central">取 [CLS] 那一列</text>
<text class="ts" x="270" y="446" text-anchor="middle" dominant-baseline="central">pooler → 768 → 2</text>
</g>
<line x1="110" y1="468" x2="110" y2="478" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="468" x2="270" y2="478" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="484" width="140" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="502" text-anchor="middle" dominant-baseline="central">和真实词 love 比</text>
<text class="ts" x="110" y="520" text-anchor="middle" dominant-baseline="central">算 loss</text>
<rect class="box" x="200" y="484" width="140" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="270" y="502" text-anchor="middle" dominant-baseline="central">和标签“正面”比</text>
<text class="ts" x="270" y="520" text-anchor="middle" dominant-baseline="central">算 loss</text>
<line x1="110" y1="540" x2="110" y2="556" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="540" x2="270" y2="556" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="562" width="300" height="52" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="190" y="580" text-anchor="middle" dominant-baseline="central">反向传播</text>
<text class="ts" x="190" y="598" text-anchor="middle" dominant-baseline="central">从 loss 往回求梯度，更新全部权重</text>
<path d="M340 588.0 L360 588.0 L360 186.0 L346 186.0" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
