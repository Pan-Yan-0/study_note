<svg xmlns="http://www.w3.org/2000/svg" width="608" height="499" viewBox="0 0 380 312" role="img">
<title>前馈层：每一列自己的 4 → 16 → 4 两层全连接</title>
<desc>love 这一列的 4 个输入神经元连到 16 个中间神经元，经过 GELU 后只有少数几个被明显点亮，再连到 4 个输出神经元。真实 BERT 是 768 → 3072 → 768。</desc>
