<svg xmlns="http://www.w3.org/2000/svg" width="608" height="813" viewBox="0 0 380 508" role="img">
<title>一层编码器里 love 这一列的数字怎么一步步变</title>
<desc>七个步骤：输入、自注意力、残差相加、LayerNorm、前馈层、残差相加、LayerNorm。右侧两条直通线表示残差：输入绕过注意力直接加到结果上，LayerNorm 的结果绕过前馈层直接加到结果上。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#B4B2A9}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect x="0" y="0" width="380" height="508" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="46" y="20" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="36" text-anchor="middle" dominant-baseline="central">输入 x（嵌入层或上一层）</text>
<text class="ts" x="170" y="54" text-anchor="middle" dominant-baseline="central">[1.57, −0.52, −1.12, 0.07]</text>
<line x1="170" y1="72" x2="170" y2="84" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="46" y="90" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="106" text-anchor="middle" dominant-baseline="central">自注意力：跨列，2 个头 + W_O</text>
<text class="ts" x="170" y="124" text-anchor="middle" dominant-baseline="central">[−0.44, 0.28, 1.14, −0.77]</text>
</g>
<line x1="170" y1="142" x2="170" y2="154" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="46" y="160" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="176" text-anchor="middle" dominant-baseline="central">相加：x + 注意力输出</text>
<text class="ts" x="170" y="194" text-anchor="middle" dominant-baseline="central">[1.13, −0.24, 0.02, −0.70]</text>
<line x1="170" y1="212" x2="170" y2="224" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="46" y="230" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="246" text-anchor="middle" dominant-baseline="central">LayerNorm</text>
<text class="ts" x="170" y="264" text-anchor="middle" dominant-baseline="central">[1.60, −0.44, −0.05, −1.11]</text>
<line x1="170" y1="282" x2="170" y2="294" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="46" y="300" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="316" text-anchor="middle" dominant-baseline="central">前馈层：列内，4 → 16 → 4</text>
<text class="ts" x="170" y="334" text-anchor="middle" dominant-baseline="central">[−0.60, −0.53, 0.32, −0.40]</text>
</g>
<line x1="170" y1="352" x2="170" y2="364" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="46" y="370" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="386" text-anchor="middle" dominant-baseline="central">相加：LayerNorm 结果 + 前馈输出</text>
<text class="ts" x="170" y="404" text-anchor="middle" dominant-baseline="central">[1.01, −0.97, 0.28, −1.51]</text>
<line x1="170" y1="422" x2="170" y2="434" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="46" y="440" width="248" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="456" text-anchor="middle" dominant-baseline="central">LayerNorm：这一层的输出</text>
<text class="ts" x="170" y="474" text-anchor="middle" dominant-baseline="central">[1.31, −0.68, 0.58, −1.22]</text>
<path d="M294 44.0 L314 44.0 L314 184.0 L300 184.0" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="320" y="114" dominant-baseline="central">残差直通</text>
<path d="M294 254.0 L314 254.0 L314 394.0 L300 394.0" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="320" y="324" dominant-baseline="central">残差直通</text>
</svg>
