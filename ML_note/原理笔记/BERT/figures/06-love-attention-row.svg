<svg xmlns="http://www.w3.org/2000/svg" width="608" height="602" viewBox="0 0 380 376" role="img">
<title>love 这一列的自注意力：权重决定各列的 v 流入输出的多少</title>
<desc>love 的 q 与六个词各自的 k 比对，得到六个权重，权重依次为 0.07、0.31、0.13、0.15、0.30、0.04。每个词的 v 按权重大小用粗细不同的连线汇入 love 的输出，输出为 0.71 和 −0.49。</desc>
