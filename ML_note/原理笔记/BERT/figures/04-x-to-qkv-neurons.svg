<svg xmlns="http://www.w3.org/2000/svg" width="608" height="458" viewBox="0 0 380 286" role="img">
<title>q、k、v 是同一列 x 连出的三组神经元</title>
<desc>左边是 love 这一列的 4 个输入神经元，右边是 6 个输出神经元，分成 q、k、v 三组，每组 2 个。每个输出神经元都和 4 个输入相连，q 的第一个神经元的 4 条连线被高亮，它的值是 −0.90。</desc>
